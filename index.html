<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DP Physics Lab</title>
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E8ECF3; --ink:#15171C; --muted:#5E6470; --line:#D9DEE7;
  --accent:#E8622A; --accent-soft:#FDE6DA; --accent-ink:#9B3610;
  --teal:#0C9C98; --teal-soft:#D8F1EF; --gold:#E6A413; --gold-soft:#FBEFCF;
  --good:#1D8F5F; --good-soft:#DDF3E8; --bad:#C8463E; --bad-soft:#F9E1DE; --idea:#6D3FC0; --idea-soft:#EEE7FA;
  --blue:#2F6FB5; --blue-soft:#DCE8F5;
  --shadow:0 1px 2px rgba(14,24,48,.06),0 8px 24px rgba(14,24,48,.07);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0F1A; --surface:#141A29; --surface-2:#1C2436; --ink:#E7EBF3; --muted:#9AA4B8; --line:#273047;
    --accent:#FF8A50; --accent-soft:#3B2216; --accent-ink:#FFB894;
    --teal:#2EC4BE; --teal-soft:#123C44; --gold:#F2BD45; --gold-soft:#3A3013;
    --good:#45C58C; --good-soft:#133A2B; --bad:#F07A71; --bad-soft:#44201E; --idea:#B99BF0; --idea-soft:#251C3B;
    --blue:#8DB8EA; --blue-soft:#16304A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0F1A; --surface:#141A29; --surface-2:#1C2436; --ink:#E7EBF3; --muted:#9AA4B8; --line:#273047;
  --accent:#FF8A50; --accent-soft:#3B2216; --accent-ink:#FFB894;
  --teal:#2EC4BE; --teal-soft:#123C44; --gold:#F2BD45; --gold-soft:#3A3013;
  --good:#45C58C; --good-soft:#133A2B; --bad:#F07A71; --bad-soft:#44201E; --idea:#B99BF0; --idea-soft:#251C3B;
  --blue:#8DB8EA; --blue-soft:#16304A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:10px 16px 64px}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:1.45rem;letter-spacing:-.01em}
h3{font-size:1.08rem}
p{margin:0 0 .6em}
ul,ol{margin:.2em 0 .6em;padding-left:1.25em}
li{margin:.15em 0}
a{color:var(--blue)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
math{font-size:1.06em}
math[display="block"]{margin:.4em 0;overflow-x:auto;overflow-y:hidden;max-width:100%}
.tabnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px}
.card + .card{margin-top:14px}
.btn{border:0;border-radius:12px;padding:10px 18px;min-height:44px;font-weight:700;font-size:1rem;background:var(--ink);color:var(--bg)}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn.accent{background:var(--accent);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;z-index:80;max-width:min(560px,calc(100vw - 32px));text-align:center;box-shadow:var(--shadow)}

/* header */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 12px}
.brand{margin-right:auto;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-size:1.18rem;font-weight:800;letter-spacing:-.01em}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}
.crumbs button{background:none;border:0;padding:2px 4px;color:var(--blue);font-weight:600}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;min-width:38px;height:38px;display:grid;place-items:center;padding:0 10px;font-weight:600;font-size:.88rem}

/* home */
.hero{position:relative;margin-inline:calc(50% - 50vw);min-height:min(62svh,560px);display:grid;align-items:end;background:#13202f center/cover no-repeat;overflow:hidden;margin-top:-10px}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,14,26,.05) 0%,rgba(8,14,26,.25) 45%,rgba(8,14,26,.82) 100%)}
.hero .in{position:relative;z-index:1;width:min(1180px,100%);margin:0 auto;padding:28px 16px 30px;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.45)}
.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:900;letter-spacing:-.035em;line-height:.95}
.hero .sub{font-size:clamp(1.02rem,2.2vw,1.35rem);font-weight:650;margin:.45em 0 .25em}
.hero p{max-width:760px;opacity:.93;margin:0}
.theme{margin-top:26px}
.theme > h2{margin-bottom:10px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.topic{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:grid;gap:4px}
.topic .code{font-weight:800;color:var(--accent-ink);font-size:.85rem;letter-spacing:.04em}
.topic b{font-size:1.05rem}
.topic.off{opacity:.55;box-shadow:none;cursor:default}
.topic:not(.off):hover{border-color:var(--ink)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:14px}
.pcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);padding:0;display:flex;flex-direction:column}
.pcard:hover{border-color:var(--ink)}
.pcard .img{aspect-ratio:4/3;background:var(--surface-2) center/cover no-repeat}
.pcard .tx{padding:12px 14px 14px;display:grid;gap:4px}
.pcard .ref{font-size:.8rem;color:var(--muted);font-weight:600}
.pcard b{font-size:1.04rem;line-height:1.25}
.status{display:inline-block;font-size:.76rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted);justify-self:start}
.status.s1{background:var(--gold-soft);color:var(--ink)}
.status.s2{background:var(--blue-soft);color:var(--ink)}
.status.s3{background:var(--good-soft);color:var(--ink)}

/* practical page */
.phead{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin:4px 0 12px}
.phead .thumb{width:112px;aspect-ratio:4/3;border-radius:12px;background:var(--surface-2) center/cover}
.phead h1{font-size:clamp(1.35rem,3vw,1.9rem);letter-spacing:-.015em}
.phead .meta{color:var(--muted);font-size:.92rem;margin-top:4px}
@media (max-width:560px){.phead{grid-template-columns:1fr}.phead .thumb{display:none}}
@media (max-width:700px){.steps{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.steps button{flex:0 0 auto}}
.steps{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:30;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:650;font-size:.92rem;display:flex;gap:7px;align-items:center}
.steps button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface-2);font-size:.75rem}
.steps button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps button[aria-current="true"] .n{background:var(--accent);color:#fff}
.steps button.done .n{background:var(--good);color:#fff}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.grid2 > *{min-width:0}
.ia{background:var(--idea-soft);border:1px solid color-mix(in srgb,var(--idea) 30%,transparent);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 22px}
.ia > .crit,.ia > h3{grid-column:1/-1}
@media (max-width:760px){.ia{grid-template-columns:1fr}}
.ia h3{color:var(--idea);display:flex;gap:8px;align-items:center}
.ia .crit{font-size:.78rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--idea)}
.ia textarea{width:100%;min-height:120px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.92rem;padding:8px 10px;resize:vertical}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:.95rem}
.kv dt{font-weight:700}
.kv dd{margin:0}
.pill{display:inline-block;background:var(--teal-soft);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:700}
.note{background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-size:.94rem}
.good{background:var(--good-soft)}
.bad{background:var(--bad-soft)}
.invs{display:grid;gap:8px}
.inv{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.inv[aria-checked="true"]{border-color:var(--teal);background:var(--teal-soft)}
.inv .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);margin-top:3px}
.inv[aria-checked="true"] .dot{border-color:var(--teal);background:radial-gradient(var(--teal) 45%,transparent 50%)}
table.vars{width:100%;border-collapse:collapse;font-size:.93rem}
table.vars td,table.vars th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.vars th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}

/* bench */
.bench{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.bench > *{min-width:0}
@media (max-width:900px){.bench{grid-template-columns:1fr}}
.rig{background:#F4F6FA;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
.rig svg{display:block;width:100%;height:auto}
.panel{display:grid;gap:12px;min-width:0}
.panel > *{min-width:0}
.ctl select{width:100%;max-width:100%}
.ctl{display:grid;gap:4px}
.ctl label{font-weight:650;font-size:.92rem;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ctl label .lt{flex:1}
.ctl label span{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl select{font:inherit;font-size:.95rem;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:40px}
.ctl .hint{font-size:.82rem;color:var(--muted)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:.93rem;font-weight:600}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--teal)}
.ivbtns{display:flex;flex-wrap:wrap;gap:6px}
.ivbtns button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-weight:650;font-size:.9rem;font-variant-numeric:tabular-nums;min-width:52px;position:relative}
.ivbtns button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ivbtns button .c{position:absolute;top:-7px;right:-7px;background:var(--teal);color:#fff;border-radius:999px;font-size:.68rem;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.readout{background:#0F1724;color:#D7F5E9;border-radius:12px;padding:10px 12px;font:600 .92rem ui-monospace,SFMono-Regular,Menlo,monospace;min-height:56px;white-space:pre-wrap;line-height:1.45}
.readout b{color:#7CF2B9}
.mini{font-size:.9rem}
.mini table{border-collapse:collapse;width:100%}
.mini td,.mini th{padding:3px 8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.mini th{color:var(--muted);font-weight:600;font-size:.8rem}
.selft{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.selft .btn{min-height:56px;font-size:1.05rem}
.watch{font:800 1.8rem ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;background:#0F1724;color:#FFD166;border-radius:12px;padding:6px}

/* results table */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.res{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
table.res th,table.res td{border:1px solid var(--line);padding:6px 9px;text-align:center;white-space:nowrap}
table.res thead th{background:var(--surface-2);font-weight:650;vertical-align:bottom;line-height:1.3}
table.res th .u{display:block;font-weight:500;font-size:.82rem;color:var(--muted)}
table.res td.proc{background:color-mix(in srgb,var(--teal-soft) 55%,transparent)}
table.res td.out{color:var(--bad);font-weight:700}
table.res input{width:84px;font:inherit;padding:3px 5px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:center}
table.res input.ok{border-color:var(--good);background:var(--good-soft)}
table.res input.no{border-color:var(--bad);background:var(--bad-soft)}
table.res tr.ex td{opacity:.45;text-decoration:line-through}
.rowx{background:none;border:0;color:var(--muted);font-size:.8rem;padding:2px 4px;text-decoration:underline}

/* graph */
.gwrap{background:#FFFFFF;border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none}
.gwrap svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.lineTabs{display:flex;gap:6px;flex-wrap:wrap}
.lineTabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88rem;display:flex;gap:7px;align-items:center}
.lineTabs button i{display:inline-block;width:22px;height:0;border-top:3px solid currentColor}
.lineTabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fitbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fitbox div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.fitbox small{display:block;color:var(--muted);font-weight:600;font-size:.78rem}
.fitbox b{font-variant-numeric:tabular-nums;font-size:1.02rem}

/* conclude / evaluate */
.qres{display:grid;gap:10px}
.ans{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ans input{width:120px;font:inherit;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.steps-tex{background:var(--surface-2);border-radius:12px;padding:8px 14px;overflow-x:auto}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.cmp div{border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.cmp small{display:block;color:var(--muted);font-weight:650;font-size:.78rem}
.cmp b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.bar{position:relative;height:56px;margin:8px 0 2px}
.err{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.err:last-child{border-bottom:0}
.err .seg{display:flex;gap:4px}
.err .seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 10px;font-weight:650;font-size:.86rem}
.err .seg button.ok{background:var(--good-soft);border-color:var(--good)}
.err .seg button.no{background:var(--bad-soft);border-color:var(--bad)}
.err .why{grid-column:1/-1;font-size:.9rem;color:var(--muted)}
@media (max-width:560px){.err{grid-template-columns:1fr}}
.foot{margin-top:28px;color:var(--muted);font-size:.85rem;text-align:center}
</style>
</head>

window.addEventListener('hashchange', route);
function route(){

  if (!parts.length) return home();

  if (parts.length === 1) return topicPage(t);
  const p = t.practicals.find(q => q.id === parts[1]); if (!p) return topicPage(t);

}

/* ---------- practical page ---------- */
let CUR = null;
function practical(t, p, step){
  const s = sess(p); s.step = step; s.seen[step] = 1; save();
  CUR = {t, p, step};
  const ctx = ctxOf(p);
  let h = topbar(`<button data-go="#/">Lab</button>›<button data-go="#/${t.id}">${t.code}</button>›<span>${p.short}</span>`);
  h += `<div class="phead"><div class="thumb" style="background-image:${img(p.img)}"></div><div><h1>${p.title}</h1><div class="meta">${t.code} ${t.title} · ${p.ref} · ${p.time}</div></div></div>`;
  h += `<nav class="steps" aria-label="Steps">${STEPS.map(([k, l], i) => `<button data-step="${k}" ${k === step ? 'aria-current="true"' : ''} class="${doneStep(ctx, k) ? 'done' : ''}"><span class="n">${doneStep(ctx, k) ? '✓' : i + 1}</span>${l}</button>`).join('')}</nav>`;
  h += `<div class="grid2"><div id="main"></div><aside class="ia" id="ia"></aside></div>`;
  app.innerHTML = h; wire();
  $$('[data-step]').forEach(b => b.onclick = () => go(`#/${t.id}/${p.id}/${b.dataset.step}`));
  const main = $('#main');
  ({plan:viewPlan, measure:viewMeasure, results:viewResults, graph:viewGraph, conclude:viewConclude, evaluate:viewEvaluate})[step](main, ctx);
  iaPanel($('#ia'), ctx, step);
}
function doneStep(ctx, k){
  const {s, run} = ctx;
  if (k === 'plan') return !!s.seen.measure;
  if (k === 'measure' || k === 'results') return run.rows.length >= 5;
  if (k === 'graph') return !!(run.lines && run.lines.max && run.lines.min);
  if (k === 'conclude') return !!(s.seen.conclude && run.lines && run.lines.max);
  if (k === 'evaluate') return Object.keys(s.ev).length >= (ctx.p.errors || []).length && (ctx.p.errors || []).length > 0;
  return false;
}
function stepLink(ctx, k, label, cls){ return `<button class="btn ${cls || ''}" data-go="#/${CUR.t.id}/${ctx.p.id}/${k}">${label}</button>`; }
function iaPanel(el, ctx, step){

}

/* ----- 2. Measure ----- */

    <div id="mini" class="mini card" style="margin-top:12px"></div></div><div class="panel">`;

  h += `<div class="card" style="padding:12px 14px"><div class="ctl"><label><span class="lt">${tx(inv.iv.name)} ${tx('$' + inv.iv.sym + '$')}${inv.iv.unit ? ' / ' + inv.iv.unit : ''}</span></label><div class="ivbtns">${inv.iv.values.map(v => `<button data-iv="${v}" aria-pressed="${v === ctx.ivv}">${ivLabel(inv, v)}${counts[v] ? `<span class="c">${counts[v]}</span>` : ''}</button>`).join('')}</div>${inv.iv.hint ? `<div class="hint">${tx(inv.iv.hint)}</div>` : ''}</div>`;

  h += `<div class="card" style="padding:12px 14px"><div class="row">${stepLink(ctx, 'results', 'Results table', 'sm')}<button class="btn ghost sm" id="newrig">New apparatus</button></div><p class="small muted" style="margin:.5em 0 0">New apparatus swaps in a fresh set (different masses, springs, friction) and clears all your readings for this practical.</p></div>`;
  h += `</div></div>`;

function doMeasure(c){
  const m = c.p.measure(c); if (!m) return null;
  if (m.fail) return {html:m.html, end:m.end, anim:m.anim};
  record(c, m.vals);
  return m;
}
function record(c, vals){
  const {inv, run} = c;
  if (inv.mode === 'paired') { const raw = {}; inv.raws.forEach(r => raw[r.key] = +roundTo(vals[r.key], r.res || 10 ** -r.dp).toFixed(r.dp)); run.rows.push({iv:c.ivv, raw}); }
  else { let row = run.rows.find(r => r.iv === c.ivv); if (!row) { row = {iv:c.ivv, reads:[]}; run.rows.push(row); } row.reads.push(+roundTo(vals[inv.dv.key], inv.dv.res || 10 ** -inv.dv.dp).toFixed(inv.dv.dp)); }
  run.lines = run.lines || null; save();
}
function runAnim(anim, drawRig, done){
  stopAnim(); const t0 = performance.now(), dur = anim.dur;
  $$('#take,#take3').forEach(b => b.disabled = true);
  const tick = now => { const f = Math.min(1, (now - t0) / dur); drawRig(anim.frame(f)); if (f < 1) ANIM = {raf:requestAnimationFrame(tick)}; else { ANIM = null; $$('#take,#take3').forEach(b => b.disabled = false); done(); } };
  ANIM = {raf:requestAnimationFrame(tick)};
}
function renderMini(ctx){
  const {inv, run} = ctx, el = $('#mini'); if (!el) return;
  if (!run.rows.length) { el.innerHTML = '<span class="muted">No readings yet for this investigation.</span>'; return; }
  if (inv.mode === 'paired') {
    const rows = run.rows.slice(-6);
    el.innerHTML = `<b>Latest runs</b> <span class="muted">(${run.rows.length} in total)</span><table><tr><th>#</th><th>${inv.iv.name}</th>${inv.raws.map(r => `<th>${tx('$' + r.sym + '$')} / ${r.unit}</th>`).join('')}</tr>${rows.map((r, i) => `<tr><td>${run.rows.length - rows.length + i + 1}</td><td>${ivLabel(inv, r.iv)}</td>${inv.raws.map(q => `<td>${fix(r.raw[q.key], q.dp)}</td>`).join('')}</tr>`).join('')}</table>`;
    return;
  }
  const rows = run.rows.slice().sort((a, b) => a.iv - b.iv);
  el.innerHTML = `<b>Readings so far</b><table><tr><th>${tx('$' + inv.iv.sym + '$')}${inv.iv.unit ? ' / ' + inv.iv.unit : ''}</th><th>${tx('$' + inv.dv.sym + '$')} / ${inv.dv.unit}</th></tr>${rows.map(r => `<tr><td>${ivLabel(inv, r.iv)}</td><td style="text-align:left;padding-left:14px">${r.reads.map(x => fix(x, inv.dv.dp)).join(', ')}</td></tr>`).join('')}</table>`;
}
/* the student's own stopwatch: real reaction time goes into the reading */
function selfTimer(el, ctx, drawRig, after){
  const {p} = ctx;
  el.innerHTML = `<div class="watch" id="watch">0.00</div><p class="small muted" id="cue" style="margin:.4em 0">Press Go. ${tx(p.selfTimeCue || '')}</p><div class="selft"><button class="btn ghost" id="go">Go</button><button class="btn accent" id="sw" disabled>Start</button></div>`;
  let run = null;
  $('#go', el).onclick = () => {
    stopAnim(); const c = ctxOf(p); const job = p.selfTime(c);
    run = {job, t0:performance.now(), start:null, stop:null}; $('#sw', el).disabled = false; $('#sw', el).textContent = 'Start'; $('#go', el).disabled = true; $('#cue', el).innerHTML = tx(job.cue);
    const tick = now => {
      const t = (now - run.t0) / 1000; drawRig(job.frame(t));
      if (run.start !== null && run.stop === null) $('#watch', el).textContent = ((now - run.start) / 1000).toFixed(2);
      if (t < job.lead + job.T + 4 && run.stop === null) ANIM = {raf:requestAnimationFrame(tick)};
      else { ANIM = null; $('#go', el).disabled = false; $('#sw', el).disabled = true; if (run.stop === null) { $('#cue', el).textContent = 'Too slow: the run is over. Press Go to try again.'; } }
    };
    ANIM = {raf:requestAnimationFrame(tick)};
  };
  $('#sw', el).onclick = () => {
    if (!run) return; const now = performance.now();
    if (run.start === null) { run.start = now; $('#sw', el).textContent = 'Stop'; return; }
    run.stop = now; const tm = Math.round((run.stop - run.start) / 10) / 100;
    $('#watch', el).textContent = tm.toFixed(2); $('#sw', el).disabled = true; $('#go', el).disabled = false;
    const c = ctxOf(p); const vals = p.selfRecord(c, tm, run.job);
    record(c, vals); const html = p.selfReadout(c, tm, run.job);
    c.s.lastOut = {inv:c.inv.id, html}; save(); $('#readout').innerHTML = html; after();
  };
}

/* ----- 3. Results ----- */
function viewResults(el, ctx){
  const {inv, run, s} = ctx; const rows = tableRows(ctx);
  if (!rows.length) { el.innerHTML = `<div class="card"><h3>Results table</h3><p>No readings yet for <b>${tx(inv.label)}</b>.</p>${stepLink(ctx, 'measure', 'Go to the bench', 'accent')}</div>`; wire(); return; }
  const self = !!s.selfProc;
  let h = `<div class="card"><div class="row" style="justify-content:space-between"><h3>Results: ${tx(inv.label)}</h3><label class="chk"><input type="checkbox" id="selfProc" ${self ? 'checked' : ''}> Process it myself</label></div>
    <p class="small muted" style="margin:.3em 0 .8em">${self ? 'Type your processed values in the shaded cells and press Check. Use the number of decimal places shown in the header hint.' : 'Raw readings are recorded exactly as the instrument showed them. Shaded columns are processed. Tick a row\'s box to leave out an anomaly (it stays in the table, struck through).'}</p>`;
  h += `<div class="tblwrap"><table class="res"><thead><tr>`;
  if (inv.mode === 'paired') {
    h += `<th>Run</th><th>${inv.iv.name}</th>${inv.raws.map(r => `<th>${head(r)}<span class="u">± ${sig(r.unc, 1)}</span></th>`).join('')}`;
  } else {
    const n = Math.max(...rows.map(r => r.reads.length));
    h += `<th rowspan="1">${head(inv.iv)}${inv.iv.unc ? `<span class="u">± ${sig(inv.iv.unc, 1)}</span>` : ''}</th>`;
    for (let k = 0; k < n; k++) h += `<th>${head(inv.dv)}<span class="u">trial ${k + 1}, ± ${sig(inv.dv.unc, 1)}</span></th>`;

/* ===== 2. Atwood machine: data-based practical from the deck (slide 29, Course Companion p.45, Part 2) ===== */
A2.atwood = (() => {

  const mass = (c, madd) => c.rig.mb + madd / 1000 * (1 + c.rig.mErr[MADD.indexOf(madd)] || 0);
  function drawPull(c, st){
    const {S, ivv, inv} = c; const bx = 150 + (st.x || 0), by = 268, a = S.ang * deg, n = Math.round(ivv / 100);

    const x0 = bx + 96, y0 = by + 12, L = 120, x1 = x0 + Math.cos(a) * 60, y1 = y0 - Math.sin(a) * 60, x2 = x1 + Math.cos(a) * L, y2 = y1 - Math.sin(a) * L;

      {label:'Weigh the carts', run:c => ({html:A2.ro([['Cart A', `${fix(roundTo(c.rig.mA, 0.001), 3)} kg`], ['Cart B', `${fix(roundTo(c.rig.mB, 0.001), 3)} kg`], ['Load for B', `${fix(roundTo(0.5 * (1 + c.rig.loadErr), 0.001), 3)} kg each`]])})}
    ],
    invs:[
      {...common, id:'sticky', label:'Carts stick together (perfectly inelastic)', desc:'Cart A, with a pin, runs into cart B, with a cork, at rest. They move off together.', mode:'paired',
        raws:[rawA, {key:'mB', name:'Mass of cart B', sym:'m_B', unit:'kg', dp:3, unc:0.001, how:'balance'}, {key:'t1', name:'Gate 1 time, A before', sym:'t_1', unit:'ms', dp:1, unc:0.1, how:'light gate'}, {key:'t2', name:'Gate 2 time, A and B after', sym:'t_2', unit:'ms', dp:1, unc:0.1, how:'light gate'}],
        method:['Weigh both carts. Compensate the runway for friction.', 'Put cart B at rest between the gates. Push cart A so it passes gate 1 and hits B; they stick and pass gate 2 together.', 'Record both gate times and the mass of B.', 'Repeat with different pushes, and with B loaded, for at least six runs.', 'Calculate the momentum before ($m_A u_A$) and after ($(m_A + m_B)v$), and the kinetic energies.'],
        cols:[pcol('pb', 'Momentum before', 'p_{\\text{before}}', 'p before', (r, c) => mAof(c, r) * 100 / r.raw.t1, 'Momentum before $= m_A \\dfrac{L}{t_1}$ with $L = 0.100$ m and $t_1$ in ms converted to s.'),
          pcol('pa', 'Momentum after', 'p_{\\text{after}}', 'p after', (r, c) => (mAof(c, r) + r.raw.mB) * 100 / r.raw.t2, 'Momentum after $= (m_A + m_B)\\dfrac{L}{t_2}$.'),
          {key:'ek', label:'Fraction of kinetic energy kept', sym:'\\dfrac{E_{k,\\text{after}}}{E_{k,\\text{before}}}', gsym:'Ek ratio', unit:'', dp:2, f:(r, c) => (mAof(c, r) + r.raw.mB) * (100 / r.raw.t2) ** 2 / (mAof(c, r) * (100 / r.raw.t1) ** 2), how:'$\\dfrac{E_{k,\\text{after}}}{E_{k,\\text{before}}}$. In a sticking collision it should be $\\dfrac{m_A}{m_A + m_B}$: kinetic energy is not conserved, momentum is.'}]},
      {...common, id:'bounce', label:'Carts bounce apart (magnets)', desc:'Facing magnets push the carts apart without contact.', mode:'paired',
        raws:[rawA, {key:'mB', name:'Mass of cart B', sym:'m_B', unit:'kg', dp:3, unc:0.001, how:'balance'}, {key:'t1', name:'Gate 1 time, A before', sym:'t_1', unit:'ms', dp:1, unc:0.1, how:'light gate'}, {key:'t2', name:'Gate 2 time, B after', sym:'t_2', unit:'ms', dp:1, unc:0.1, how:'light gate'}, {key:'t3', name:'Time for A after (negative if it came back through gate 1, 0 if it stopped)', sym:'t_3', unit:'ms', dp:1, unc:0.1, zeroSkip:true, how:'whichever gate A passes after the collision'}],
        method:['Fit facing magnets to the carts. Compensate for friction.', 'Push A into B at rest. Record A at gate 1, B at gate 2, and A again wherever it goes.', 'Record A’s time after as negative if it bounced back through gate 1.', 'Repeat with different pushes and loads.', 'Calculate the total momentum before and after, taking right as positive.'],
        cols:[pcol('pb', 'Momentum before', 'p_{\\text{before}}', 'p before', (r, c) => mAof(c, r) * 100 / r.raw.t1, 'Momentum before $= m_A \\dfrac{L}{t_1}$.'),
          pcol('pa', 'Momentum after', 'p_{\\text{after}}', 'p after', (r, c) => r.raw.mB * 100 / r.raw.t2 + (r.raw.t3 ? mAof(c, r) * 100 / r.raw.t3 : 0), 'Momentum after $= m_B \\dfrac{L}{t_2} + m_A \\dfrac{L}{t_3}$, with $t_3$ negative for a rebound (velocity to the left).'),
          {key:'ek', label:'Fraction of kinetic energy kept', sym:'\\dfrac{E_{k,\\text{after}}}{E_{k,\\text{before}}}', gsym:'Ek ratio', unit:'', dp:2, f:(r, c) => (r.raw.mB * (100 / r.raw.t2) ** 2 + (r.raw.t3 ? mAof(c, r) * (100 / r.raw.t3) ** 2 : 0)) / (mAof(c, r) * (100 / r.raw.t1) ** 2), how:'$\\dfrac{E_{k,\\text{after}}}{E_{k,\\text{before}}}$: close to 1 for a nearly elastic magnetic bounce.'}]},
      {...common, id:'explode', label:'Explosion from rest (plunger)', desc:'The carts start at rest together; the plunger pushes them apart.', mode:'paired',
        iv:{key:'load', name:'Load on cart B', sym:'\\text{load}', unit:'kg', values:[0, 0.5, 1], labels:['0', '0.50', '1.00'], dp:2, unc:0, how:'0.50 kg masses on B, to vary the ratio of the masses'},
        raws:[rawA, {key:'mB', name:'Mass of cart B', sym:'m_B', unit:'kg', dp:3, unc:0.001, how:'balance'}, {key:'tA', name:'Gate 1 time, cart A', sym:'t_A', unit:'ms', dp:1, unc:0.1, how:'light gate'}, {key:'tB', name:'Gate 2 time, cart B', sym:'t_B', unit:'ms', dp:1, unc:0.1, how:'light gate'}],
        controls:[['Starting point', 'carts touching, at rest, midway between the gates'], ['Plunger', 'same spring setting each time'], ['Friction', 'runway compensated (it only works for motion one way!)']],

        cols:[{key:'mr', label:'Mass ratio', sym:'\\dfrac{m_B}{m_A}', gsym:'m(B) / m(A)', unit:'', dp:3, f:(r, c) => r.raw.mB / mAof(c, r), how:'Mass ratio $\\dfrac{m_B}{m_A}$ from the balance readings.'},
          {key:'vr', label:'Speed ratio', sym:'\\dfrac{v_A}{v_B}', gsym:'v(A) / v(B)', unit:'', dp:3, f:r => r.raw.tB / r.raw.tA, how:'Speed ratio $\\dfrac{v_A}{v_B} = \\dfrac{t_B}{t_A}$, because both cards are the same length.'},
          pcol('pb', 'Momentum of B', 'p_B', 'p of B', r => r.raw.mB * 100 / r.raw.tB, 'Momentum of B $= m_B \\dfrac{L}{t_B}$ (to the right).'),

    ],

    ],

    extension:['Compare the kinetic energy kept in sticking and bouncing collisions: which are elastic?', 'The deck\u2019s trick: place stop blocks at distances in the inverse ratio of the masses and listen for one bang, not two.'],

      da:['Momentum $= m\\dfrac{L}{t}$, with $L$ the card length and $t$ the gate time; propagate the mass and time uncertainties.', 'Plot momentum after against momentum before for the collisions, and the speed ratio against the mass ratio for the explosion.'],
      concl:['State whether momentum is conserved within the uncertainty, using the gradient and intercept.', 'Compare the kinetic energy before and after for each type of collision.'],

/* ===== 8. The whirling bung: testing F = mv²/r (deck Demonstration 9, slide 171, Part 12) ===== */
A2.bung = (() => {
  const LV = [0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90], MV = [0.050, 0.100, 0.150, 0.200, 0.250], LFIX = 0.60, MFIX = 0.100;
  const TX = 250, TY = 228, PXM = 250;
  function phys(c){ const {rig, inv} = c; const L = inv.id === 'L' ? c.ivv : LFIX, M = inv.id === 'M' ? c.ivv : MFIX; const Mt = M * (1 + rig.mErr), T = Mt * G, v = Math.sqrt(T * L / rig.m); return {L, M, T, v, Trev:2 * Math.PI * L / v, sinth:Math.min(0.9, rig.m / Mt)}; }
  function draw(c, st){
    const p = phys(c), L = p.L, ct = Math.sqrt(1 - p.sinth * p.sinth), rx = L * ct * PXM * 0.62, ry = rx * 0.22, cy = TY - 40 + L * p.sinth * PXM * 0.4;
    const ph = st.ph || 0.6, bx = TX + rx * Math.cos(ph), by = cy + ry * Math.sin(ph), front = Math.sin(ph) > 0;
    let s = `<ellipse cx="${TX}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#9AA4B8" stroke-dasharray="4 5"/>`;
    const bung = `<ellipse cx="${bx}" cy="${by}" rx="${front ? 13 : 11}" ry="${front ? 10 : 8}" fill="#3A3F47" stroke="#1C1C1E"/>`;
    if (!front) s += `<line x1="${TX}" y1="${TY - 40}" x2="${bx}" y2="${by}" stroke="#1C1C1E" stroke-width="1.4"/>` + bung;
    s += `<rect x="${TX - 6}" y="${TY - 40}" width="12" height="62" rx="4" fill="#DCEBF5" stroke="#5E6470" stroke-width="1.5"/><ellipse cx="${TX}" cy="${TY - 5}" rx="22" ry="30" fill="#E9C9A7" stroke="#B88A62"/>`;
    if (front) s += `<line x1="${TX}" y1="${TY - 40}" x2="${bx}" y2="${by}" stroke="#1C1C1E" stroke-width="1.4"/>` + bung;
    s += `<line x1="${TX}" y1="${TY + 22}" x2="${TX}" y2="${TY + 52}" stroke="#1C1C1E" stroke-width="1.4"/><rect x="${TX - 7}" y="${TY + 32}" width="14" height="5" rx="2" fill="#C8463E"/>` + T(TX + 14, TY + 38, 'paper clip', {fs:11, fill:'#C8463E'});
    const nMass = Math.round(p.M / 0.050) - 1; s += massStack(TX, TY + 52, nMass, 30).s + T(TX + 22, TY + 76, `M = ${fix(p.M * 1000, 0)} g`, {fs:13, bold:true});
    s += `<line x1="${TX + 4}" y1="${TY - 58}" x2="${TX + rx}" y2="${TY - 58}" stroke="#E8622A" stroke-width="2"/>` + T(TX + rx / 2, TY - 64, `L = ${fix(L, 2)} m`, {anchor:'middle', fs:13, bold:true, fill:'#E8622A'});
    s += A2.watch(560, 24, st.watch || '0.00', !!st.on);
    if (st.count !== undefined) s += T(608, 112, `${st.count}`, {anchor:'middle', fs:40, bold:true, fill:'#2F6FB5'}) + T(608, 132, 'turns since Go', {anchor:'middle', fs:11, fill:'#5E6470'});
    if (st.go) s += T(TX + rx + 20, cy, 'Go!', {fs:20, bold:true, fill:'#1D8F5F'});
    s += T(20, 30, `bung ${fix(c.rig.mBal * 1000, 1)} g (balance) · timing ${c.S.nrev} turns`, {fs:13, fill:'#3D4250'});
    s += T(20, 372, 'Goggles on: everyone, spectators too.', {fs:12, fill:'#C8463E', bold:true});
    return A2.svg(720, 390, s, 'Bung whirled in a horizontal circle on a string through a tube, with a hanging mass below');
  }
  function measure(c){
    const {rig, R, S} = c; const p = phys(c), N = +S.nrev;
    const Tt = p.T + R.u(-1, 1) * rig.fr, Lt = p.L + R.n(0, 0.008), Trev = 2 * Math.PI * Lt / Math.sqrt(Tt * Lt / rig.m);
    const miscount = R.chance(0.04) ? (R.chance(0.5) ? 1 : -1) : 0;
    const t = (N + miscount) * Trev + R.n(rig.react, 0.12);
    return {vals:{t}, html:A2.ro([[`Time for ${N} turns`, `${fix(roundTo(t, 0.01), 2)} s`], `(L = ${fix(p.L, 2)} m, M = ${fix(p.M * 1000, 0)} g)`]), end:{ph:0.6, watch:fix(roundTo(t, 0.01), 2)},
      anim:{dur:2200, frame:f => ({ph:0.6 + 2 * Math.PI * f * 2200 / 1000 / p.Trev, watch:fix(t * f, 2), on:f < 1})}};
  }
  const vcols = (Lf) => [
    {key:'T', label:'Period', sym:'T', gsym:'T', unit:'s', dp:3, f:(r, c) => r.mean / +c.S.nrev, how:'Period $T = \\dfrac{\\text{time for the turns}}{\\text{number of turns}}$.'},
    {key:'v2', label:'v²', sym:'v^2', gsym:'v²', unit:'m² s⁻²', dp:1, f:(r, c) => (2 * Math.PI * Lf(r) * +c.S.nrev / r.mean) ** 2, how:'$v = \\dfrac{2\\pi L}{T}$ and then $v^2$; its percentage uncertainty is double that of $v$, which adds those of $L$ and $T$.'}
  ];
  return {
    id:'bung', title:'The whirling bung: centripetal force', short:'Whirling bung', img:'bung', ref:'Demonstration 9 · slide 171 · Part 12', time:'20 to 30 min',
    blurb:'Whirl a bung on a string, time the turns and test $F = \\dfrac{mv^2}{r}$ from a $v^2$ graph.',
    aim:'Test the equation for centripetal force, $F = \\dfrac{mv^2}{r}$, by whirling a bung in a horizontal circle, with the tension in the string provided by a hanging mass.',
    theory:'$$Mg = \\dfrac{mv^2}{L} \\;\\Rightarrow\\; v^2 = \\dfrac{Mg}{m}\\,L \\qquad v = \\dfrac{2\\pi L}{T}$$',
    apparatus:['fire-polished glass tube about 15 cm long', 'strong nylon string, about 1.5 m', 'rubber bung (or foam ball) of mass about 20 g', '50 g hanger and 50 g slotted masses', 'paper clip as a marker, metre rule, stopwatch', 'safety goggles for everyone'],
    safety:['Everyone wears goggles, including spectators. Stand well back and whirl one group at a time if space is tight.', 'Use a fire-polished tube: a raw cut tube saws through the string. Check every knot first.', 'Stop if anyone whirls near a window, a light fitting or another group.'],
    rig(R){ const m = R.u(0.018, 0.026); return {m, mBal:roundTo(m + R.n(0, 0.0001), 0.0001), mErr:R.n(0, 0.004), fr:R.u(0.01, 0.035), react:R.n(0.02, 0.03)}; },
    setup:[{key:'nrev', type:'select', label:'Number of turns timed', def:'10', lock:true, opts:[['10', '10 turns'], ['20', '20 turns']], hint:'More turns: the reaction time is a smaller fraction of the total.'}],
    tools:[{label:'Weigh the bung', run:c => ({html:A2.ro([['Bung on the balance', `${fix(c.rig.mBal * 1000, 1)} g`]])})}],
    invs:[
      {id:'L', label:'Vary the radius ($v^2$ against $L$, constant $M$)', desc:'Hanging mass fixed at 100 g; move the paper clip to change the length of string to the bung.', mode:'grouped', selfTime:true,
        iv:{key:'L', name:'Length of string from tube to bung', sym:'L', gsym:'L', unit:'m', values:LV, dp:2, unc:0.005, how:'metre rule from the top of the tube to the centre of the bung, with the clip set just below the tube'},
        dv:{key:'t', name:'Time for the turns', sym:'t', gsym:'t', unit:'s', dp:2, unc:0.01, how:'stopwatch, counting turns aloud'},
        controls:[['Hanging mass $M$', '100 g throughout'], ['Bung', 'same bung, weighed once'], ['Number of turns timed', 'the same for every reading'], ['Clip position', 'whirl so the clip stays just below the tube']],
        method:['Weigh the bung. Hang 100 g below the tube.', 'Set the length $L$ with the paper clip just below the tube.', 'Whirl the bung in a horizontal circle above your head, fast enough to keep the clip just below the tube.', 'Time 10 turns. Repeat three times.', 'Change $L$ and repeat; calculate $T$, $v = \\dfrac{2\\pi L}{T}$ and $v^2$.'],
        cols:vcols(r => r.iv), x:'iv', y:'v2', gradUnit:'m s⁻²', expect:'Expect a straight line through the origin with gradient $\\dfrac{Mg}{m}$.',
        gradNote:'$Mg = \\dfrac{mv^2}{L}$ gives $v^2 = \\dfrac{Mg}{m}L$, so the gradient of $v^2$ against $L$ is $\\dfrac{Mg}{m}$, in m s⁻².',
        interceptNote:'Friction between the string and the tube changes the tension a little from run to run; measuring $L$ to the edge rather than the centre of the bung shifts every point.',
        result(fit, c){ const m = MFIX * G / fit.m, fr = fit.dm / fit.m + 0.001 / MFIX;
          return [{label:'Mass of the bung', sym:'m', unit:'kg', val:m, unc:m * fr, steps:[`m = \\dfrac{Mg}{\\text{gradient}} = \\dfrac{0.100 \\times 9.8}{${sig(fit.m, 4)}} = ${sig(m, 3)}\\text{ kg}`, `\\dfrac{\\Delta m}{m} = \\dfrac{\\Delta(\\text{gradient})}{\\text{gradient}} + \\dfrac{\\Delta M}{M} = ${sig(fit.dm / fit.m, 2)} + 0.010 = ${sig(fr, 2)}`, `\\Delta m = ${sig(m * fr, 2)}\\text{ kg}`], acc:{val:c.rig.mBal, src:'bung on the balance'}}]; }},
      {id:'M', label:'Vary the tension ($v^2$ against $M$, constant $L$)', desc:'Length fixed at 0.60 m; change the hanging mass.', mode:'grouped', selfTime:true,
        iv:{key:'M', name:'Hanging mass', sym:'M', gsym:'M', unit:'kg', values:MV, dp:3, unc:0.001, how:'50 g hanger plus 50 g slotted masses'},
        dv:{key:'t', name:'Time for the turns', sym:'t', gsym:'t', unit:'s', dp:2, unc:0.01, how:'stopwatch, counting turns aloud'},
        controls:[['Length $L$', '0.60 m, clip just below the tube'], ['Bung', 'same bung'], ['Number of turns timed', 'the same for every reading']],
        method:['Set $L$ = 0.60 m with the paper clip.', 'Hang 50 g below the tube and whirl at the speed that keeps the clip still. Time the turns three times.', 'Increase the hanging mass in 50 g steps and repeat.', 'Calculate $T$, $v$ and $v^2$; plot $v^2$ against $M$.'],
        cols:vcols(() => LFIX), x:'iv', y:'v2', gradUnit:'m² s⁻² kg⁻¹', expect:'Expect a straight line through the origin with gradient $\\dfrac{gL}{m}$.',
        gradNote:'$v^2 = \\dfrac{gL}{m}M$, so the gradient of $v^2$ against $M$ is $\\dfrac{gL}{m}$.',
        interceptNote:'Tube friction acts against the clip creeping up or down, so the true tension is not exactly $Mg$.',
        result(fit, c){ const m = G * LFIX / fit.m, fr = fit.dm / fit.m + 0.005 / LFIX;
          return [{label:'Mass of the bung', sym:'m', unit:'kg', val:m, unc:m * fr, steps:[`m = \\dfrac{gL}{\\text{gradient}} = \\dfrac{9.8 \\times 0.60}{${sig(fit.m, 4)}} = ${sig(m, 3)}\\text{ kg}`, `\\dfrac{\\Delta m}{m} = ${sig(fit.dm / fit.m, 2)} + \\dfrac{0.005}{0.60} = ${sig(fr, 2)}`, `\\Delta m = ${sig(m * fr, 2)}\\text{ kg}`], acc:{val:c.rig.mBal, src:'bung on the balance'}}]; }}
    ],
    measure, draw,
    selfTimeCue:'Start the watch on "Go!" and stop it after the set number of turns.',
    selfTime(c){ const p = phys(c), N = +c.S.nrev, lead = 1.6; return {T:N * p.Trev, lead, cue:`Press <b>Start</b> when you see <b>Go!</b> and <b>Stop</b> when the counter reaches <b>${N}</b>.`,
      frame:t => ({ph:0.6 + 2 * Math.PI * t / p.Trev, count:t < lead ? 0 : Math.floor((t - lead) / p.Trev + 1e-9), go:t >= lead && t < lead + 0.5})}; },
    selfRecord:(c, tm) => ({t:tm}),
    selfReadout:(c, tm, job) => A2.ro([['Your stopwatch', `${fix(tm, 2)} s`], `(${c.S.nrev} turns took ${fix(job.T, 2)} s: your reading is ${A2.diff(tm, job.T)})`]),
    errors:[
      {t:'Reaction time starting and stopping the watch.', k:'r', e:'Random: about ± 0.1 to 0.2 s each time. Timing more turns makes it a smaller fraction of the total.'},
      {t:'Miscounting the number of turns.', k:'r', e:'Random but large: one turn too many or too few gives an anomalous reading, about 10% off for 10 turns. Spot it and repeat.'},
      {t:'The paper clip creeps up or down during the timing, so the radius changes.', k:'r', e:'Random: $L$ is not constant during a run, adding scatter to $v$.'},
      {t:'Friction between the string and the tube.', k:'r', e:'Random in this experiment: it acts against whichever way the string is slipping, so the tension is a little above or below $Mg$ from run to run.'},
      {t:'Measuring $L$ to the edge of the bung instead of its centre.', k:'s', e:'Systematic: every length is short by the same amount, so the line is shifted and does not pass through the origin.'}
    ],
    improve:['Time 20 turns rather than 10, and count aloud with a partner.', 'Use a light gate or a phone video to time the turns.', 'Mark $L$ to the centre of the bung, and keep the clip just below the tube by adjusting the whirl rate.', 'Use a smooth, fire-polished tube and a nylon string to reduce friction.', 'Repeat each length several times and discard miscounted runs with a reason.'],
    extension:['Show that the sag cancels: the vertical component of tension holds the bung up, and the horizontal component $Mg\\cos\\theta$ acts on a radius $L\\cos\\theta$.', 'Plot $T^2$ against $L$ instead and find the gradient you expect.'],
    ia:{rd:['Explain how the hanging mass sets the centripetal force and why the clip must stay just below the tube.', 'Justify the number of turns timed.'],
      da:['$T = \\dfrac{\\text{time}}{\\text{number of turns}}$, so the uncertainty in $T$ is divided by that number too.', 'The percentage uncertainty in $v^2$ is double that of $v$.'],
      concl:['Compare the bung mass from the gradient with the balance reading.', 'Say whether $v^2 \\propto L$ within the uncertainty.'],
      eval:['Rank the errors by their effect on your result: timing, counting, clip creep, friction.', 'Explain why the sag of the string does not matter when $L$ is the string length.']}
  };
})();
